<!doctype html>
<!-- @dsCard group="Components" name="UI Kit · The Foundation v2" -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Foundation v2 — Column &amp; Co.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="./assets/logo-icon.svg">
  <link rel="stylesheet" href="./colors_and_type.css">

  <!-- Bundler thumbnail (splash + no-JS fallback) -->
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
      <rect width="100" height="100" fill="#1C3D2E"/>
      <g transform="translate(30 20)">
        <rect x="0"  y="0"  width="12" height="28" fill="#C5A95A"/>
        <rect x="0"  y="32" width="12" height="6"  fill="#C5A95A"/>
        <rect x="0"  y="42" width="12" height="18" fill="#C5A95A"/>
        <rect x="14" y="0"  width="12" height="28" fill="#FAF8F2" opacity="0.85"/>
        <rect x="14" y="32" width="12" height="6"  fill="#FAF8F2" opacity="0.45"/>
        <rect x="14" y="42" width="12" height="18" fill="#FAF8F2" opacity="0.18"/>
        <rect x="28" y="0"  width="12" height="28" fill="#FAF8F2" opacity="0.45"/>
        <rect x="28" y="32" width="12" height="6"  fill="#FAF8F2" opacity="0.85"/>
        <rect x="28" y="42" width="12" height="18" fill="#FAF8F2" opacity="0.18"/>
      </g>
    </svg>
  </template>

  <!-- JS/JSX-referenced assets (bundler can't discover JSX img src strings) -->
  <meta name="ext-resource-dependency" content="./assets/logo-icon-cream.svg" data-resource-id="logoIconCream">
  <meta name="ext-resource-dependency" content="./assets/logo-icon-on-forest.svg" data-resource-id="logoIconOnForest">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: #1C3D2E;
      font-family: 'Jost', sans-serif;
      color: #1C3D2E;
      -webkit-font-smoothing: antialiased;
    }
    /* Frame the prototype inside a desktop-like surface */
    .stage {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #1C3D2E;
    }
    .browser-bar {
      background: #2D5C45;
      color: #FAF8F2;
      padding: 9px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
    }
    .browser-bar .traffic {
      display: flex; gap: 7px;
    }
    .browser-bar .traffic span {
      width: 11px; height: 11px; border-radius: 999px; display: block;
      background: rgba(250,248,242,0.25);
    }
    .browser-bar .url {
      flex: 1;
      background: rgba(28,61,46,0.45);
      border-radius: 4px;
      padding: 5px 14px;
      color: rgba(250,248,242,0.85);
      font-size: 12px;
      max-width: 720px;
    }
    .browser-bar .badge {
      background: #C5A95A;
      color: #1C3D2E;
      padding: 3px 9px;
      border-radius: 2px;
      font-weight: 600;
      font-size: 9.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .app {
      flex: 1;
      overflow: hidden;
    }

    /* Palette CSS variables driven by [data-cc-palette] on .app */
    .app[data-cc-palette]    { /* defaults set in colors_and_type.css */ }

    /* Custom scrollbar inside the sheet area */
    .sheet-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
    .sheet-scroll::-webkit-scrollbar-thumb { background: rgba(28,61,46,0.20); border-radius: 999px; }
    .sheet-scroll::-webkit-scrollbar-track { background: transparent; }

    /* Make the prototype scale on smaller viewports — keep design at 1280 min */
    @media (max-width: 1280px) {
      .stage { font-size: 14px; }
    }
  </style>

  <!-- React + Babel pinned per design-system rules -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root" class="stage" data-screen-label="The Foundation v2"></div>

  <!-- Data first, then components, then chrome, then tabs, then app -->
  <script src="data.js"></script>
  <script type="text/babel" src="components.jsx" data-presets="env,react"></script>
  <script type="text/babel" src="chrome.jsx"     data-presets="env,react"></script>
  <script type="text/babel" src="tabs-overview.jsx" data-presets="env,react"></script>
  <script type="text/babel" src="tabs-analysis.jsx" data-presets="env,react"></script>
  <script type="text/babel" src="tabs-actions.jsx"  data-presets="env,react"></script>

  <script type="text/babel" data-presets="env,react">
    const { useState } = React;

    function App() {
      const [tab, setTab] = useState('dashboard');
      const [paletteId, setPaletteId] = useState('light');
      const [paletteOpen, setPaletteOpen] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);

      // Close popovers on outside click
      React.useEffect(() => {
        function onDoc(e) {
          if (!e.target.closest || (!e.target.closest('[data-popover]') && !e.target.closest('[data-popover-trigger]'))) {
            setPaletteOpen(false);
            setMenuOpen(false);
          }
        }
        document.addEventListener('mousedown', onDoc);
        return () => document.removeEventListener('mousedown', onDoc);
      }, []);

      // Render the active sheet
      const renderTab = () => {
        switch (tab) {
          case 'start':     return <StartHereTab />;
          case 'dashboard': return <DashboardTab />;
          case 'trends':    return <TrendsTab />;
          case 'goals':     return <GoalsTab />;
          case 'health':    return <HealthScoreTab />;
          case 'networth':  return <NetWorthTab />;
          case 'import':    return <BankImportTab />;
          case 'budget':    return <MonthlyBudgetTab />;
          case 'tx':        return <StubTab tab="Transactions"   copy="The ledger. Every transaction lives here — imported from your bank or typed by hand. Dropdowns extended to row 5,000 (4–5 years of runway)." />;
          case 'accounts':  return <StubTab tab="Accounts"       copy="Register every bank account, credit card, savings account, and loan. Current balances feed Net Worth automatically. The import flow validates against this registry." />;
          case 'cats':      return <StubTab tab="Categories"     copy="20 spending categories with keyword rules. WHOLE FOODS hits Food & Dining. NETFLIX hits Subscriptions. Edit the rules and future imports adjust automatically." />;
          case 'engine':    return <StubTab tab="_Engine"        copy="System tab — visible but locked. Six months of aggregates (extensible to 24) feed every chart and table. You should never need to edit anything here." />;
          default:          return <DashboardTab />;
        }
      };

      const tabLabel = (window.CC_DATA.tabs.find(t => t.id === tab) || {}).label || '';

      return (
        <>
          <div className="browser-bar">
            <div className="traffic"><span></span><span></span><span></span></div>
            <div className="url">docs.google.com / spreadsheets / d / 1AaBbCcDd... / Brooks Household — The Foundation v2</div>
            <span className="badge">PROTOTYPE</span>
          </div>
          <div className="app sheet-scroll" data-cc-palette={paletteId} data-screen-label={'01 ' + tabLabel}>
            <SheetsChrome
              activeTab={tab}
              onTabChange={setTab}
              paletteId={paletteId}
              onPaletteChange={setPaletteId}
              paletteOpen={paletteOpen}
              setPaletteOpen={setPaletteOpen}
              menuOpen={menuOpen}
              setMenuOpen={setMenuOpen}
            >
              {renderTab()}
            </SheetsChrome>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
