<!doctype html>
<!-- @dsCard group="Colors" name="Colors · Semantic (in-sheet)" subtitle="Yellow input, success/warn/danger — never brand-facing" viewport="700x220" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
  <div class="card-row">
    <div class="swatch" style="background:#FFFDE7;color:#1C3D2E;border:1px solid #C5A95A;">
      <div><div class="role">INPUT CELL</div><div class="name" style="margin-top:6px;">Yellow</div></div>
      <div class="hex">#FFFDE7</div>
    </div>
    <div class="swatch" style="background:#16a34a;color:#FAF8F2;">
      <div><div class="role">SUCCESS · NET-GREEN</div><div class="name" style="margin-top:6px;">Status Good</div></div>
      <div class="hex">#16A34A</div>
    </div>
    <div class="swatch" style="background:#C8873A;color:#FAF8F2;">
      <div><div class="role">WARNING</div><div class="name" style="margin-top:6px;">Caution Orange</div></div>
      <div class="hex">#C8873A</div>
    </div>
    <div class="swatch" style="background:#832f30;color:#FAF8F2;">
      <div><div class="role">EXPENSE-RED</div><div class="name" style="margin-top:6px;">Danger</div></div>
      <div class="hex">#832F30</div>
    </div>
  </div>
  <div style="margin-top:12px;font-size:10.5px;color:rgba(28,61,46,0.6);font-family:var(--cc-font-body);">In-sheet only — semantic chips, KPI cards, status pills. Never use for brand communications.</div>
</div></body></html>
