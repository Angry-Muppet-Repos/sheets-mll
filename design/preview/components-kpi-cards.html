<!doctype html>
<!-- @dsCard group="Components" name="KPI Cards" subtitle="Dashboard top row — Forest · Danger · Net · Gold" viewport="700x170" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card" style="background:#F0EBD8;">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">
    <!-- KPI: Income (Forest) -->
    <div>
      <div style="background:#1C3D2E;color:#FAF8F2;padding:8px 12px;font:600 9.5px/1 'Jost',sans-serif;letter-spacing:0.16em;text-transform:uppercase;">Total Income</div>
      <div style="background:#FAF8F2;padding:14px 12px 12px;border:1px solid rgba(28,61,46,0.10);border-top:0;">
        <div style="font:700 22px/1 'Playfair Display',serif;color:#1C3D2E;font-variant-numeric:tabular-nums;">$10,230</div>
        <div style="font:300 10px/1.2 'Jost',sans-serif;color:rgba(28,61,46,0.55);margin-top:6px;">vs last month +1.4%</div>
      </div>
    </div>
    <!-- KPI: Expenses (Danger band) -->
    <div>
      <div style="background:#832f30;color:#FAF8F2;padding:8px 12px;font:600 9.5px/1 'Jost',sans-serif;letter-spacing:0.16em;text-transform:uppercase;">Total Expenses</div>
      <div style="background:#FAF8F2;padding:14px 12px 12px;border:1px solid rgba(28,61,46,0.10);border-top:0;">
        <div style="font:700 22px/1 'Playfair Display',serif;color:#1C3D2E;font-variant-numeric:tabular-nums;">$6,980</div>
        <div style="font:300 10px/1.2 'Jost',sans-serif;color:rgba(28,61,46,0.55);margin-top:6px;">vs last month +8.2%</div>
      </div>
    </div>
    <!-- KPI: Net Cash Flow (Forest, the positive one) -->
    <div>
      <div style="background:#1C3D2E;color:#FAF8F2;padding:8px 12px;font:600 9.5px/1 'Jost',sans-serif;letter-spacing:0.16em;text-transform:uppercase;">Net Cash Flow</div>
      <div style="background:#FAF8F2;padding:14px 12px 12px;border:1px solid rgba(28,61,46,0.10);border-top:0;">
        <div style="font:700 22px/1 'Playfair Display',serif;color:#16a34a;font-variant-numeric:tabular-nums;">+$3,250</div>
        <div style="font:300 10px/1.2 'Jost',sans-serif;color:rgba(28,61,46,0.55);margin-top:6px;">vs last month −$680</div>
      </div>
    </div>
    <!-- KPI: Savings Rate (Gold) -->
    <div>
      <div style="background:#C5A95A;color:#1C3D2E;padding:8px 12px;font:600 9.5px/1 'Jost',sans-serif;letter-spacing:0.16em;text-transform:uppercase;">Savings Rate</div>
      <div style="background:#FAF8F2;padding:14px 12px 12px;border:1px solid rgba(28,61,46,0.10);border-top:0;">
        <div style="font:700 22px/1 'Playfair Display',serif;color:#1C3D2E;font-variant-numeric:tabular-nums;">31.8<span style="font-size:14px;">%</span></div>
        <div style="font:300 10px/1.2 'Jost',sans-serif;color:rgba(28,61,46,0.55);margin-top:6px;">goal: 20%+</div>
      </div>
    </div>
  </div>
</div></body></html>
