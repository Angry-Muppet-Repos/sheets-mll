<!doctype html>
<!-- @dsCard group="Brand" name="Colorways · Green vs Navy" subtitle="Default Green & Gold + future Navy & Gold colorway" viewport="700x240" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card" style="padding:0;">
  <!-- Two-up: Green & Gold (default) vs Navy & Gold (future) -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:0;background:#FAF8F2;">

    <!-- Green & Gold -->
    <div style="padding:20px 22px;background:#FAF8F2;">
      <div style="font-family:'Jost',sans-serif;font-weight:500;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:#2D5C45;margin-bottom:14px;">DEFAULT · GREEN &amp; GOLD</div>
      <img src="../assets/logo-lockup-primary.svg" style="width:100%;max-width:230px;display:block;margin-bottom:14px;"/>
      <div style="display:flex;gap:4px;height:18px;">
        <div style="flex:1;background:#1C3D2E;"></div>
        <div style="flex:1;background:#2D5C45;"></div>
        <div style="flex:1;background:#C5A95A;"></div>
        <div style="flex:1;background:#F0EBD8;"></div>
        <div style="flex:1;background:#FAF8F2;border:1px solid rgba(28,61,46,0.10);"></div>
      </div>
      <div style="display:flex;gap:4px;margin-top:5px;font-family:'Jost',sans-serif;font-size:8px;letter-spacing:0.08em;color:rgba(28,61,46,0.6);">
        <span style="flex:1;text-align:center;">FOREST</span>
        <span style="flex:1;text-align:center;">CANOPY</span>
        <span style="flex:1;text-align:center;">GOLD</span>
        <span style="flex:1;text-align:center;">CREAM</span>
        <span style="flex:1;text-align:center;">PARCH</span>
      </div>
    </div>

    <!-- Navy & Gold -->
    <div style="padding:20px 22px;background:#F7F6F2;border-left:1px solid rgba(28,61,46,0.08);">
      <div style="font-family:'Jost',sans-serif;font-weight:500;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:#2C3E6B;margin-bottom:14px;">FUTURE · NAVY &amp; GOLD</div>
      <img src="../assets/logo-lockup-navy.svg" style="width:100%;max-width:230px;display:block;margin-bottom:14px;"/>
      <div style="display:flex;gap:4px;height:18px;">
        <div style="flex:1;background:#1B2A4A;"></div>
        <div style="flex:1;background:#2C3E6B;"></div>
        <div style="flex:1;background:#C8873A;"></div>
        <div style="flex:1;background:#F5D9B0;"></div>
        <div style="flex:1;background:#F7F6F2;border:1px solid rgba(27,42,74,0.10);"></div>
      </div>
      <div style="display:flex;gap:4px;margin-top:5px;font-family:'Jost',sans-serif;font-size:8px;letter-spacing:0.08em;color:rgba(27,42,74,0.6);">
        <span style="flex:1;text-align:center;">NAVY</span>
        <span style="flex:1;text-align:center;">NAVY MID</span>
        <span style="flex:1;text-align:center;">GOLD</span>
        <span style="flex:1;text-align:center;">GOLD LT</span>
        <span style="flex:1;text-align:center;">CREAM</span>
      </div>
    </div>

  </div>
  <div style="padding:12px 22px;background:#FAF8F2;border-top:1px solid rgba(28,61,46,0.08);font-family:'Jost',sans-serif;font-weight:300;font-size:11px;color:rgba(28,61,46,0.65);line-height:1.55;">
    Green &amp; Gold is the default colorway today (The Foundation). Navy &amp; Gold is reserved for future products in the line. Activate with <code style="background:rgba(28,61,46,0.08);padding:1px 6px;border-radius:2px;font-size:10px;">data-cc-colorway="navy"</code> on your root element.
  </div>
</div></body></html>
