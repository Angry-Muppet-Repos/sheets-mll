<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary · Accent · Outline · Link · States" viewport="700x170" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
  <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;">
    <!-- Primary -->
    <button style="background:#1C3D2E;color:#FAF8F2;border:0;padding:11px 22px;border-radius:4px;font:600 12px/1 'Jost',sans-serif;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;">Apply Theme</button>
    <!-- Gold accent -->
    <button style="background:#C5A95A;color:#1C3D2E;border:0;padding:11px 22px;border-radius:4px;font:600 12px/1 'Jost',sans-serif;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;">Import</button>
    <!-- Secondary outlined -->
    <button style="background:transparent;color:#1C3D2E;border:1.5px solid #1C3D2E;padding:9.5px 20px;border-radius:4px;font:600 12px/1 'Jost',sans-serif;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;">Clear Zone</button>
    <!-- Tertiary link -->
    <a href="#" style="color:#1C3D2E;font:500 12px/1 'Jost',sans-serif;letter-spacing:0.04em;text-decoration:underline;text-underline-offset:4px;text-decoration-color:#C5A95A;text-decoration-thickness:1px;">Help / Quick Reference →</a>
  </div>
  <div style="margin-top:18px;display:flex;gap:12px;align-items:center;">
    <!-- Disabled -->
    <button style="background:#1C3D2E;color:#FAF8F2;border:0;padding:11px 22px;border-radius:4px;font:600 12px/1 'Jost',sans-serif;letter-spacing:0.12em;text-transform:uppercase;opacity:0.4;cursor:not-allowed;">Disabled</button>
    <!-- Focus state -->
    <button style="background:#1C3D2E;color:#FAF8F2;border:0;padding:11px 22px;border-radius:4px;font:600 12px/1 'Jost',sans-serif;letter-spacing:0.12em;text-transform:uppercase;box-shadow:0 0 0 3px rgba(197,169,90,0.45);">Focused</button>
    <!-- Small -->
    <button style="background:transparent;color:#1C3D2E;border:1px solid rgba(28,61,46,0.25);padding:6px 14px;border-radius:3px;font:500 10px/1 'Jost',sans-serif;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;">Small</button>
  </div>
</div></body></html>
