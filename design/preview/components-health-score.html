<!doctype html>
<!-- @dsCard group="Components" name="Health Score Composite" subtitle="0–100 score block + scale + biggest opportunity callout" viewport="700x240" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
  <div class="cc-section-label" style="margin-bottom:14px;">HEALTH SCORE · COMPOSITE</div>
  <div style="display:flex;gap:24px;align-items:flex-start;">
    <!-- Number block -->
    <div style="background:#1C3D2E;color:#FAF8F2;padding:18px 26px;border-radius:4px;min-width:148px;text-align:center;">
      <div style="font:700 56px/1 'Playfair Display',serif;color:#FAF8F2;font-variant-numeric:tabular-nums;">72</div>
      <div style="font:500 9px/1 'Jost',sans-serif;letter-spacing:0.20em;color:#C5A95A;margin-top:8px;">OUT OF 100</div>
      <div style="font:400 13px/1 'Playfair Display',serif;font-style:italic;color:#FAF8F2;margin-top:12px;">Good</div>
    </div>
    <!-- Scale + opportunity -->
    <div style="flex:1;">
      <div style="font:500 10px/1.2 'Jost',sans-serif;letter-spacing:0.18em;text-transform:uppercase;color:#2D5C45;margin-bottom:10px;">⚡ Biggest Opportunity</div>
      <div style="font:italic 400 18px/1.2 'Playfair Display',serif;color:#1C3D2E;">Food &amp; Dining is 42% over budget.</div>
      <div style="font:300 12px/1.5 'Jost',sans-serif;color:rgba(28,61,46,0.75);margin-top:6px;">Cut delivery apps — cook 4 nights/week. Brings composite to ~78.</div>
      <!-- Inline scale -->
      <div style="margin-top:18px;display:flex;align-items:center;gap:0;height:18px;border-radius:2px;overflow:hidden;border:1px solid rgba(28,61,46,0.12);">
        <div style="flex:45;background:#832f30;"></div>
        <div style="flex:15;background:#C8873A;"></div>
        <div style="flex:15;background:#C5A95A;"></div>
        <div style="flex:15;background:#2D5C45;"></div>
        <div style="flex:10;background:#1C3D2E;"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:5px;font:300 9px/1 'Jost',sans-serif;color:rgba(28,61,46,0.55);letter-spacing:0.04em;">
        <span>0 · Critical</span><span>45</span><span>60 · Fair</span><span>75</span><span>90 · Excellent · 100</span>
      </div>
      <!-- Indicator pip at 72 -->
      <div style="position:relative;margin-top:-32px;height:18px;pointer-events:none;"><div style="position:absolute;left:72%;top:-4px;width:2px;height:26px;background:#FAF8F2;box-shadow:0 0 0 2px #1C3D2E;border-radius:1px;"></div></div>
    </div>
  </div>
</div></body></html>
