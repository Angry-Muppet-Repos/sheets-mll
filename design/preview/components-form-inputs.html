<!doctype html>
<!-- @dsCard group="Components" name="Form Inputs" subtitle="Text · Dropdown · Focused (gold halo) · Error" viewport="700x230" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
  <div class="cc-section-label" style="margin-bottom:14px;">FORM INPUTS</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;font-family:'Jost',sans-serif;">
    <!-- Text input -->
    <div>
      <div style="font-size:10px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:#2D5C45;margin-bottom:6px;">Account Name</div>
      <input value="Chase Joint Checking" style="width:100%;background:#FAF8F2;border:1px solid rgba(28,61,46,0.20);border-radius:4px;padding:10px 12px;font:400 13px/1 'Jost',sans-serif;color:#1C3D2E;outline:none;"/>
    </div>
    <!-- Dropdown -->
    <div>
      <div style="font-size:10px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:#2D5C45;margin-bottom:6px;">Theme Palette</div>
      <div style="background:#FAF8F2;border:1px solid rgba(28,61,46,0.20);border-radius:4px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font:400 13px/1 'Jost',sans-serif;color:#1C3D2E;">
        <span>Light</span><span style="font-size:10px;opacity:0.5;">▾</span>
      </div>
    </div>
    <!-- Focused (gold halo) -->
    <div>
      <div style="font-size:10px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:#2D5C45;margin-bottom:6px;">Target Amount <span style="color:#C5A95A;">· focused</span></div>
      <input value="$5,000" style="width:100%;background:#FFFDE7;border:1px solid #C5A95A;border-radius:4px;padding:10px 12px;font:500 13px/1 'Jost',sans-serif;color:#1C3D2E;outline:none;box-shadow:0 0 0 3px rgba(197,169,90,0.35);"/>
    </div>
    <!-- Error -->
    <div>
      <div style="font-size:10px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:#2D5C45;margin-bottom:6px;">Account Name <span style="color:#832f30;">· error</span></div>
      <input value="" placeholder="Type your account name in C6" style="width:100%;background:#FAF8F2;border:1px solid #832f30;border-radius:4px;padding:10px 12px;font:400 13px/1 'Jost',sans-serif;color:#1C3D2E;outline:none;"/>
      <div style="margin-top:5px;font-size:10.5px;color:#832f30;">Account name is required before importing.</div>
    </div>
  </div>
</div></body></html>
