const TABS=[
  {id:'start',label:'Start Here'},{id:'dashboard',label:'Dashboard'},{id:'plan',label:'The Plan'},
  {id:'compare',label:'Compare'},{id:'debts',label:'Debts'},{id:'payments',label:'Payments Log'},
  {id:'progress',label:'Progress'},{id:'hall',label:'The Hall'},{id:'import',label:'Bank Import'},
  {id:'engine',label:'_Engine',sys:true},
];
let active='dashboard'; let scrubM=HIST; let raceM=23;

function chrome(tab,sub){return '<div class="bhead"><div class="lock"><div><div class="mark">Column &amp; Co.</div><div class="tag">LIFE, ORGANIZED.</div></div></div><div class="crumb">The Payoff v1 &nbsp;·&nbsp; '+tab+'</div></div><div class="bband"><span>'+(sub||'')+'</span></div><div class="brule"></div>';}
function foot(){return '<div class="foot">The Payoff v1.0 &nbsp;·&nbsp; columnandco.com &nbsp;·&nbsp; Do not distribute without license</div>';}
function title(n,d){return '<div class="ttitle">'+n+'</div><div class="tdesc">'+d+'</div>';}

function tStart(){return chrome('Start Here','SETUP')+'<div class="tcontent">'+title('Every debt. One date.','A plan you own — list your debts, pick a strategy, and watch your temple rise as you pay.')
  +'<div class="zl">THE ANATOMY · THE VOCABULARY OF THE PRODUCT</div>'
  +'<div class="row" style="gap:14px;flex-wrap:wrap">'
  +['STYLOBATE · the stone you stand on (your buffer)','COLUMN · one debt, rising as you pay','CAPITAL · a debt paid in full','ENTABLATURE · the roofline goal','PEDIMENT · debt-free'].map(s=>'<span class="chip ahead" style="font-size:10.5px">'+s+'</span>').join('')+'</div>'
  +'<div class="zl">SETUP · 6 STEPS</div><div class="tbl"><div class="th" style="grid-template-columns:30px 1.2fr 2fr"><div>#</div><div>Step</div><div>What you do</div></div>'
  +[['1','Install the script','Extensions → Apps Script → paste the file. A 💳 menu appears.'],['2','List your debts','Debts tab — name, balance, APR, minimum. One row each.'],['3','Pick a strategy','The Plan — Snowball, Avalanche, or your own order.'],['4','Set your extra','One cell. Watch the debt-free date jump closer.'],['5','Log payments','Payments Log as money lands — or paste a bank CSV.'],['6','Watch it rise','The Dashboard temple builds itself from your payments.']].map((s,i)=>'<div class="tr'+(i%2?' z':'')+'" style="grid-template-columns:30px 1.2fr 2fr"><div class="mut">'+s[0]+'</div><div style="font-weight:600">'+s[1]+'</div><div class="note" style="margin:0">'+s[2]+'</div></div>').join('')+'</div>'
  +'<div class="ctrls"><span class="ci">Ask Claude or ChatGPT: <b>"Which payoff order saves me the most, and what does +$75/month buy me?"</b> — the hidden _Schema tab explains your sheet.</span></div>'
  +foot()+'</div>';}

function tDash(){return chrome('Dashboard','YOUR TEMPLE TODAY')+'<div class="tcontent">'+title('Dashboard','Where you stand. Your debts are becoming a temple — '+Math.round(R.paidToDate/R.total*100)+'% built.')
  +'<div style="text-align:center">'+'<div class="zl" style="text-align:left">THE WALL · WHAT YOU STILL OWE · '+fmt(R.totalNow)+'</div>'
  +'<div style="display:flex;justify-content:center">'+wallHTML('snowball',HIST)+'</div>'
  +'<div class="zl" style="text-align:left">THE TEMPLE · WHAT YOU HAVE MADE PERMANENT</div>'
  +'<div style="display:flex;justify-content:center">'+templeHTML('snowball',HIST,{cell:10,stylobate:true})+'</div></div>'
  +'<div class="ctrls"><button class="btn" id="watch">▶ Watch the build</button><span class="ci">replays your climb, course by course — past into projection</span></div>'
  +'<div class="zl">THE NUMBERS</div><div class="kpis">'
  +kpi('TOTAL DEBT NOW',fmt(R.totalNow),'of '+fmt(R.total)+' at the start')
  +kpi('PAID OFF TO DATE',fmt(R.paidToDate),'14 months of work')
  +kpi('DEBT-FREE DATE',R.freeDate,R.monthsLeft+' months · snowball + $250')
  +kpi('SAVED vs MINIMUMS',fmt(R.savedWindow),'minimums never finish — still '+fmt(R.stillOweMin)+' owed at 10 yrs')+'</div>'
  +'<div class="zl">THIS MONTH</div><div class="tbl"><div class="th" style="grid-template-columns:1.4fr .8fr .8fr 1.6fr"><div>Debt</div><div>Due</div><div class="rt">Min</div><div>Status</div></div>'
  +[['Auto loan','the 3rd','$212','on','covered — gets the pool'],['Visa ····4417','the 17th','$196','on','minimum while Auto dies'],['Student loan','the 21st','$190','fair','due in 8 days'],['Mortgage','the 1st','$1,055','ahead','tracked · not in plan']].map((r,i)=>'<div class="tr'+(i%2?' z':'')+'" style="grid-template-columns:1.4fr .8fr .8fr 1.6fr"><div style="font-weight:500">'+r[0]+'</div><div class="mut">'+r[1]+'</div><div class="rt">'+r[2]+'</div><div><span class="chip '+r[3]+'">'+r[4]+'</span></div></div>').join('')+'</div>'
  +foot()+'</div>';}
function kpi(k,v,s){return '<div class="kpi"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div></div>';}

function tPlan(){const m=scrubM;const owed=debts.reduce((a,d,i)=>a+balOf('snowball',i,m),0);
  return chrome('The Plan','SNOWBALL · 47 MONTHS LEFT')+'<div class="tcontent">'+title('The Plan','Pick a strategy, set your extra — then drag the Time Machine to stand in any month of your future.')
  +'<div class="row" style="gap:18px;margin-bottom:16px"><div><div class="k" style="font-size:9px;font-weight:600;letter-spacing:.14em;color:var(--m)">STRATEGY</div><span class="yin" style="margin-top:4px;display:inline-block">Snowball — smallest first ▾</span></div>'
  +'<div><div class="k" style="font-size:9px;font-weight:600;letter-spacing:.14em;color:var(--m)">EXTRA · MONTHLY</div><span class="yin" style="margin-top:4px;display:inline-block">$250</span></div>'
  +'<div style="margin-left:auto;display:flex;gap:9px"><span class="chip ahead" style="border:1px dashed var(--a)">+$50 → 2 mo sooner</span><span class="chip ahead" style="border:1px dashed var(--a)">+$100 → 6 mo sooner</span></div></div>'
  +'<div style="background:var(--p);border-radius:4px;padding:18px 22px;display:flex;gap:24px;align-items:baseline;color:#FAF8F2;margin-bottom:14px"><div><div style="font-size:9px;letter-spacing:.2em;color:var(--a)">DEBT-FREE</div><div style="font-family:\'Playfair Display\',serif;font-weight:700;font-size:40px;line-height:1">'+R.freeDate+'</div></div>'
  +'<div><div style="font-family:\'Playfair Display\',serif;font-weight:700;font-size:20px">'+R.monthsLeft+' mo</div><div style="font-size:9.5px;opacity:.65">left on this plan</div></div>'
  +'<div><div style="font-family:\'Playfair Display\',serif;font-weight:700;font-size:20px">'+fmt(R.planInterest)+'</div><div style="font-size:9.5px;opacity:.65">interest on this plan</div></div>'
  +'<div><div style="font-family:\'Playfair Display\',serif;font-weight:700;font-size:20px">'+fmt(R.savedWindow)+'</div><div style="font-size:9.5px;opacity:.65">saved vs minimums</div></div></div>'
  +'<div class="zl">THE TIME MACHINE · STAND IN ANY MONTH OF YOUR PLAN</div>'
  +'<div style="text-align:center"><div style="display:flex;justify-content:center">'+templeHTML('snowball',m,{cell:9})+'</div></div>'
  +'<div class="ctrls"><span class="ci">⟵ past</span><input type="range" id="scrub" min="0" max="51" value="'+m+'" style="flex:1;accent-color:var(--a)"><span class="ci">future ⟶</span><span class="ci" id="scrubLab"><b>'+monthName(m)+'</b> · '+(owed<=0?'debt-free':fmt(owed)+' to go')+'</span></div>'
  +foot()+'</div>';}

function tCompare(){const m=raceM;
  return chrome('Compare','SAME MONEY · TWO ROADS')+'<div class="tcontent">'+title('Compare','Snowball against avalanche, computed in full. Same debts, same extra — watch them fill different columns.')
  +'<div style="background:var(--a);border-radius:5px;padding:10px 16px;font-size:12px;font-weight:500;color:#1C3D2E;margin-bottom:16px">Avalanche saves '+fmt(R.snowball.interest-R.avalanche.interest)+' over the snowball · the snowball\'s first win lands 15 months sooner.</div>'
  +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">'
  +lane('Snowball','smallest balance first','snowball',m)+lane('Avalanche','highest APR first','avalanche',m)+'</div>'
  +'<div class="ctrls"><button class="btn" id="race">▶ Run the race</button><input type="range" id="raceScrub" min="0" max="51" value="'+m+'" style="flex:1;accent-color:var(--a)"><span class="ci">Month <b id="raceMl">'+m+'</b></span></div>'
  +foot()+'</div>';}
function lane(nm,sub,strat,m){return '<div style="border:1px solid rgba(28,61,46,.12);border-radius:6px;padding:12px 14px;background:#fff"><div style="font-size:11px;font-weight:700">'+nm+' <span class="note">· '+sub+'</span></div>'
  +'<div class="row" style="gap:18px;margin:7px 0"><div><div style="font-family:\'Playfair Display\',serif;font-weight:700;font-size:18px;color:var(--p)">'+R[strat].months+' mo</div><div style="font-size:8.5px;color:rgba(28,61,46,.6)">DEBT-FREE</div></div><div><div style="font-family:\'Playfair Display\',serif;font-weight:700;font-size:18px;color:var(--p)">'+fmt(R[strat].interest)+'</div><div style="font-size:8.5px;color:rgba(28,61,46,.6)">INTEREST</div></div></div>'
  +'<div style="display:flex;justify-content:center">'+templeHTML(strat,m,{cell:6})+'</div></div>';}

function tDebts(){const rows=debts.map((d,i)=>{const pct=Math.max(0,(d.start-d.cur)/d.start),full=d.cur<=0;
  const st=full?'<span class="chip on">PAID ✓</span>':(d.name==='Visa ····4417'?'<span class="chip fair">Underwater min</span>':'<span class="chip fair">ACTIVE</span>');
  return '<div class="tr'+(i%2?' z':'')+'" style="grid-template-columns:1.4fr .8fr .8fr .5fr .6fr .6fr 1fr .9fr"><div><span class="yin" style="font-size:11px">'+d.name+'</span></div><div class="mut" style="font-size:11px">'+d.type+'</div><div class="rt">'+fmt(d.start)+'</div><div class="rt">'+d.apr+'%</div><div class="rt">$'+d.min+'</div><div class="mut" style="font-size:10px">'+(d.name==='Student loan'?'Yes*':'Yes')+'</div><div class="rt" style="font-weight:600">'+(d.cur<=0?'—':fmt(d.cur))+'</div><div>'+st+'</div></div>';}).join('')
  +'<div class="tr" style="grid-template-columns:1.4fr .8fr .8fr .5fr .6fr .6fr 1fr .9fr;opacity:.55"><div>Mortgage</div><div class="mut" style="font-size:11px">Mortgage</div><div class="rt">$148,000</div><div class="rt">6.1%</div><div class="rt">$1,055</div><div class="mut" style="font-size:10px">No</div><div class="rt">$142,840</div><div><span class="chip ahead">TRACKED</span></div></div>';
  return chrome('Debts','6 LISTED · 2 PAID · 25 SLOTS')+'<div class="tcontent">'+title('Debts','List each debt once — balance, APR, minimum. Yellow is yours; everything else computes.')
  +'<div class="tbl"><div class="th" style="grid-template-columns:1.4fr .8fr .8fr .5fr .6fr .6fr 1fr .9fr"><div>Debt</div><div>Type</div><div class="rt">Start</div><div class="rt">APR</div><div class="rt">Min</div><div>In plan?</div><div class="rt">Balance now</div><div>Status</div></div>'+rows+'</div>'
  +'<div class="note" style="margin-top:10px">In plan? = No keeps the mortgage tracked without driving the date. Underwater min = the minimum does not cover one month of interest (the Visa grew until the snowball arrived). *Student loan uses a Balance override — type your statement figure and it wins.</div>'
  +foot()+'</div>';}

function tPayments(){const rows=[['Jun 12','Auto loan','$647','$30','target — gets the pool'],['Jun 11','Visa ····4417','$196','$204','minimum (underwater)'],['Jun 10','Student loan','$190','$76',''],['May 12','Auto loan','$612','$32',''],['May 10','Visa ····4417','$196','$205',''],['May 9','Student loan','$190','$77','']];
  return chrome('Payments Log','APPEND ONE ROW PER PAYMENT')+'<div class="tcontent">'+title('Payments Log','One row when money goes out. Leave the interest portion blank and the whole payment counts as principal.')
  +'<div class="tbl"><div class="th" style="grid-template-columns:.8fr 1.6fr .9fr 1.1fr 1.6fr"><div>Date</div><div>Debt</div><div class="rt">Amount</div><div class="rt">Interest part</div><div>Note</div></div>'
  +rows.map((r,i)=>'<div class="tr'+(i%2?' z':'')+'" style="grid-template-columns:.8fr 1.6fr .9fr 1.1fr 1.6fr"><div><span class="yin" style="font-size:11px">'+r[0]+'</span></div><div>'+r[1]+'</div><div class="rt"><span class="yin" style="font-size:11px">'+r[2]+'</span></div><div class="rt mut">'+r[3]+'</div><div class="note" style="margin:0">'+r[4]+'</div></div>').join('')+'</div>'
  +'<div class="note" style="margin-top:10px">5,000 rows, prewired. 💳 → Renumber Payments restores formats. Paste from your bank on the Bank Import tab.</div>'
  +foot()+'</div>';}

function tProgress(){const sv=saved(),pct=Math.min(100,Math.round(sv/GOAL*100)),funded=sv>=GOAL;
  const tw=debts.reduce((a,d)=>a+(d.w*9+(d.w-1)*1.5),0)+(debts.length-1)*7;
  return chrome('Progress','THE STYLOBATE + YOUR STREAKS')+'<div class="tcontent">'+title('Progress','Build the stone you stand on, and keep your streaks alive — the habits that keep you out of debt for good.')
  +'<div class="zl">THE STYLOBATE · YOUR BUFFER, THE TEMPLE\'S BASE</div>'
  +'<div style="text-align:center"><div style="display:flex;justify-content:center">'+templeHTML('snowball',HIST,{cell:9,stylobate:true})+'</div>'
  +'<div style="font-family:\'Playfair Display\',serif;font-style:italic;font-size:12px;color:'+(funded?'#7a5a1e':'rgba(28,61,46,.7)')+';margin-top:8px" id="stylolab">'+(funded?'✦ The Stylobate is laid — your temple stands on solid stone.':'THE STYLOBATE · '+fmt(sv)+' of '+fmt(GOAL)+' in stone — keep laying it')+'</div>'
  +'<div class="led" id="led" style="margin-top:6px">CONTRIBUTIONS'+contributions.map(c=>'<span class="pill2">'+c.when+' · +$'+c.amt+'</span>').join('')+'</div></div>'
  +'<div class="ctrls"><span class="ci" id="svinfo">SAVED <b>'+fmt(sv)+'</b> of '+fmt(GOAL)+'</span><span style="width:1px;height:16px;background:rgba(250,248,242,.2)"></span><span class="ci">Goal $<input class="cin" id="goal" value="1000"></span><span class="ci">Contribution $<input class="cin" id="amt" value="50"></span><button class="btn" id="contrib">＋ Log it in stone</button></div>'
  +'<div class="zl">YOUR STREAKS · THE HABITS THAT KEEP YOU FREE</div><div class="kpis" style="grid-template-columns:repeat(3,1fr)">'
  +kpi('🔥 BEAT THE MINIMUM','14 mo','every month you paid more than required')
  +kpi('🛡️ NO NEW DEBT','14 mo','no balance has risen since you started')
  +kpi('✓ WEEKLY CHECK-IN','9 wks','you reviewed your plan — the habit that predicts finishing')+'</div>'
  +foot()+'</div>';}

function tHall(){return chrome('The Hall','STEP INSIDE THE TEMPLE')+'<div class="tcontent">'+title('The Hall','A room you enter. Every debt you slay mounts a plaque; every record takes a pedestal. The empty places are waiting.')
  +'<div class="hall"><div class="he">— you have entered the temple —</div><div class="ht">The Hall of the Paid</div>'
  +'<div class="hz">◆ DEBTS SLAIN ◆</div><div class="plaqs">'
  +'<div class="plaq"><div class="sl2">✦</div><div class="pn">Store card</div><div class="pa">$1,150 slain</div><div class="pd">SEP 2025 · 5 MONTHS · FIRST BLOOD</div></div>'
  +'<div class="plaq"><div class="sl2">✦</div><div class="pn">Medical bill</div><div class="pa">$3,400 slain</div><div class="pd">APR 2026 · 12 MONTHS</div></div>'
  +'<div class="plaq dim"><div class="sl2">3</div><div class="pn">Auto loan</div><div class="pd">NEXT TO FALL · EST JUN 2027</div></div></div>'
  +'<div class="hz">◆ RECORDS ◆</div><div class="peds">'
  +'<div class="ped"><div class="cup">🏆</div><div class="base"><div class="rv">14 mo</div><div class="rk">longest streak</div></div></div>'
  +'<div class="ped"><div class="cup">🛡️</div><div class="base"><div class="rv">14 mo</div><div class="rk">no new debt</div></div></div>'
  +'<div class="ped"><div class="cup">⚡</div><div class="base"><div class="rv">5 mo</div><div class="rk">fastest kill</div></div></div>'
  +'<div class="ped"><div class="cup">🏛️</div><div class="base"><div class="rv">$9,210</div><div class="rk">total slain</div></div></div>'
  +'<div class="ped lock"><div class="cup">½</div><div class="base"><div class="rv">halfway</div><div class="rk">at $20,475</div></div></div>'
  +'<div class="ped lock"><div class="cup">★</div><div class="base"><div class="rv">debt-free</div><div class="rk">the golden temple</div></div></div></div></div>'
  +foot()+'</div>';}

function tImport(){return chrome('Bank Import','PASTE · MAP · APPEND')+'<div class="tcontent">'+title('Bank Import','Paste your bank export. The Payoff sniffs the columns, maps descriptions to your debts, dedupes, and appends to the Payments Log.')
  +'<div class="zl">1 · PASTE YOUR CSV</div><div style="background:#fff;border:1px dashed var(--a);border-radius:4px;padding:14px;font-family:monospace;font-size:11px;color:rgba(28,61,46,.7)">06/12/2026,ACH PYMT CHASE CARD,-196.00<br>06/12/2026,AUTOPAY TOYOTA FIN,-647.00<br>06/10/2026,SALLIE MAE EDU,-190.00</div>'
  +'<div class="zl">2 · MAPPED (keyword rules → your debts)</div><div class="tbl"><div class="th" style="grid-template-columns:1.6fr 1.3fr .8fr .9fr"><div>Description</div><div>Matched debt</div><div class="rt">Amount</div><div>Status</div></div>'
  +[['ACH PYMT CHASE CARD','Visa ····4417','$196','new'],['AUTOPAY TOYOTA FIN','Auto loan','$647','new'],['SALLIE MAE EDU','Student loan','$190','duplicate — skip']].map((r,i)=>'<div class="tr'+(i%2?' z':'')+'" style="grid-template-columns:1.6fr 1.3fr .8fr .9fr"><div class="note" style="margin:0;font-family:monospace">'+r[0]+'</div><div style="font-weight:500">'+r[1]+'</div><div class="rt">'+r[2]+'</div><div><span class="chip '+(r[3][0]==='d'?'ahead':'on')+'">'+r[3]+'</span></div></div>').join('')+'</div>'
  +'<div class="ctrls"><button class="btn">Append 2 new payments</button><span class="ci">keyword rules live on the Debts tab · inherited from the Foundation importer</span></div>'
  +foot()+'</div>';}

function tEngine(){return chrome('_Engine','SYSTEM · HIDDEN')+'<div class="tcontent">'+title('_Engine','The projection math. Five full payoff schedules (snowball, avalanche, your order, +$50, +$100) at 25 debts × 120 months. You never edit it.')
  +'<div class="note">Hidden in the shipped workbook. Holds the registry mirror, the five schedule blocks, the actuals block, and the minimums-only baseline — everything the Dashboard, Plan, Compare, and Progress tabs read. Capacity dials (25 debts · 120-month horizon) live in section 00 of the script.</div>'+foot()+'</div>';}

const RENDER={start:tStart,dashboard:tDash,plan:tPlan,compare:tCompare,debts:tDebts,payments:tPayments,progress:tProgress,hall:tHall,import:tImport,engine:tEngine};

function applyPalette(){const p=PALETTES[palette];const a=document.getElementById('app');a.style.setProperty('--p',p.p);a.style.setProperty('--m',p.m);a.style.setProperty('--a',p.a);a.style.setProperty('--bg',p.bg);a.style.setProperty('--z',p.z);document.getElementById('palname').textContent=p.name;}
function renderTabs(){document.getElementById('tabstrip').innerHTML='<span class="t" style="color:#5F6368">＋</span>'+TABS.map(t=>'<span class="t'+(t.sys?' sys':'')+(active===t.id?' on':'')+'" data-t="'+t.id+'">'+t.label+'</span>').join('');
  document.querySelectorAll('.tabstrip .t[data-t]').forEach(e=>e.onclick=()=>{active=e.dataset.t;draw();});}
function draw(){document.getElementById('sheet').innerHTML=RENDER[active]();document.getElementById('sheetwrap').scrollTop=0;renderTabs();wire();}
function wire(){
  if(active==='plan'){const s=document.getElementById('scrub');if(s)s.oninput=e=>{scrubM=+e.target.value;draw();};}
  if(active==='compare'){const s=document.getElementById('raceScrub');if(s)s.oninput=e=>{raceM=+e.target.value;draw();};
    const r=document.getElementById('race');if(r)r.onclick=()=>{raceM=0;draw();const iv=setInterval(()=>{if(raceM>=51){clearInterval(iv);return;}raceM++;draw();},220);};}
  if(active==='dashboard'){const w=document.getElementById('watch');if(w)w.onclick=()=>toast('<b>Watch the build</b><br>In the workbook this replays your climb course by course, toasting each kill — Store card (Sep 2025), Medical bill (Apr 2026) — up to today and on into your projection.');}
  if(active==='progress'){const c=document.getElementById('contrib');if(c)c.onclick=()=>{const amt=parseInt(String(document.getElementById('amt').value).replace(/[^0-9]/g,''))||0;if(amt<=0)return;contributions.push({amt:amt,when:'now'});const now=saved(),funded=now>=GOAL,pct=Math.min(100,Math.round(now/GOAL*100));toast(funded?'<b>✦ The Stylobate is complete.</b><br>Your temple stands on solid stone — '+fmt(now)+' set aside.':'<b>+$'+amt+' laid in stone.</b><br>The Stylobate is '+pct+'% solid · '+fmt(GOAL-now)+' to go.');draw();};
    const g=document.getElementById('goal');if(g)g.oninput=e=>{GOAL=Math.max(1,parseInt(String(e.target.value).replace(/[^0-9]/g,''))||0);draw();};}
}
document.getElementById('pill').onclick=()=>{const ids=Object.keys(PALETTES);palette=ids[(ids.indexOf(palette)+1)%ids.length];applyPalette();};
document.getElementById('ccmenu').onclick=function(){const ex=document.getElementById('mp');if(ex){ex.remove();return;}const d=document.createElement('div');d.className='menupop';d.id='mp';d.innerHTML=['Add a debt…','Log a payment…','Log a Stylobate contribution…','— sep','Watch the build','Frame a win for sharing…','— sep','Apply Theme','Import Bank CSV…'].map(x=>x==='— sep'?'<div class="sep"></div>':'<div>'+x+'</div>').join('');this.appendChild(d);};
applyPalette();draw();
</script>
</body>
